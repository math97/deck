# Gate de qualidade e segurança: a catraca.
#
# Mede golangci-lint e gosec, compara com .ci/baseline.txt e recusa qualquer
# achado novo. O estado de hoje é o teto, e o teto só desce.
#
# São dois jobs de propósito. `permissions` não aceita expressão — é valor
# literal —, então a única forma de o privilégio de escrita existir apenas onde
# ele é usado é separar quem confere de quem grava. `conferir` roda sempre com
# token read-only; `atualizar` só existe em push na main.
#
# Isso não é só higiene. Em PR vindo de fork o GITHUB_TOKEN é read-only por
# trava do GitHub, independente do que se declare aqui — mas um baseline que
# afrouxasse durante a revisão seria superfície de ataque de qualquer jeito: o
# fork empurraria o teto mais alto junto com o código. Ver ADR-0005.
name: gate-qualidade

on:
  workflow_call:
    inputs:
      atualizar-baseline:
        description: "Regravar o baseline quando o estado melhorar (só na main)"
        type: boolean
        default: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Versões fixas de propósito: linter que muda de versão sozinho muda a
      # contagem sozinho, e a catraca reprovaria um PR que não mexeu em nada.
      - name: instalar as ferramentas
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.9
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: conferir a catraca
        run: go run ./tools/ratchet conferir

  # Só aqui a catraca desce, e só depois do merge.
  atualizar:
    needs: conferir
    if: inputs.atualizar-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: instalar as ferramentas
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.9
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: baixar o teto quando melhora
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          go run ./tools/ratchet atualizar
          if git diff --quiet -- .ci/baseline.txt; then
            echo "baseline inalterado"
            exit 0
          fi
          # [skip ci] evita gastar um run inteiro para recalcular o que este
          # job acabou de calcular.
          git add .ci/baseline.txt
          git commit -m "deck: catraca desce após melhora [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
