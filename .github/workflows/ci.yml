# CI: só orquestra. Cada gate mora no seu arquivo e é chamado daqui.
#
# A separação existe para que o gate de qualidade possa ser chamado com
# parâmetros diferentes em PR e na main — em PR ele só confere, na main ele
# pode baixar o teto — sem duplicar o YAML.
name: ci

# `pull_request`, NUNCA `pull_request_target`.
#
# A troca costuma ser proposta com o argumento de "fazer o CI de fork funcionar
# melhor", e é o jeito mais curto de furar a catraca: `pull_request_target` roda
# com o token do repositório base E com o código do fork. Hoje um fork não
# consegue afrouxar o baseline por duas razões independentes — o token de fork é
# read-only, e o job `atualizar` nem existe em PR. A troca derruba a primeira e
# deixa tudo pendurado na segunda. Ver ADR-0005.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Push seguido em PR cancela o run anterior; na main não se cancela nada,
# porque o job de baseline commita e ser interrompido no meio de um push deixa
# estado estranho.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  teste:
    uses: ./.github/workflows/gate-teste.yml

  qualidade:
    uses: ./.github/workflows/gate-qualidade.yml
    with:
      # Só depois do merge. Ver a explicação no próprio gate.
      atualizar-baseline: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
